name: One-off – English release notes
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          for tag in $(gh release list -R "$REPO" --limit 50 --json tagName --jq '.[].tagName'); do
            body=$(gh release view "$tag" -R "$REPO" --json body --jq .body)
            case "$body" in
              "Fork d'ObtainX"*)
                gh release edit "$tag" -R "$REPO" --notes "ObtainX fork with Obtainium pack subscriptions (Recomp, RJNY, Joey's). Based on ObtainX 2.21.0."
                echo "edited $tag";;
            esac
          done
