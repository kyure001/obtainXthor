name: ObtainX Thor – build et release

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "android/**"
      - "assets/**"
      - "test/pack_merge_test.dart"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/thor-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: thor-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Dépendances
        run: flutter pub get

      - name: Tests de la synchro des packs
        run: flutter test test/pack_merge_test.dart

      - name: Analyse du code ObtainX Thor
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/services/pack_subscriptions.dart lib/pages/packs_section.dart lib/main.dart lib/providers/apps_provider.dart lib/pages/settings.dart

      - name: Signature
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          K_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KS_PASS" ] || [ -z "$K_ALIAS" ]; then
            echo "::warning::Secrets de signature absents : APK non signé, pas de release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_B64" | tr -d ' \n\r' | base64 -d > android/app/release.p12
          cat > android/key.properties <<PROPS
          storePassword=$KS_PASS
          keyPassword=$KS_PASS
          keyAlias=$K_ALIAS
          storeFile=release.p12
          PROPS
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Version
        id: version
        run: |
          VERSION=$(grep -oP "^version: \K[^+]+" pubspec.yaml)
          CODE=$(grep -oP "^version: [^+]+\+\K[0-9]+" pubspec.yaml)
          echo "name=${VERSION}-thor.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "code=$((CODE * 1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Build APK arm64
        run: |
          flutter build apk --release --flavor normal --target-platform android-arm64 \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ steps.version.outputs.code }}"
          OUT=build/app/outputs/flutter-apk
          mv "$OUT/app-normal-release.apk" "$OUT/ObtainX-Thor-v${{ steps.version.outputs.name }}-arm64-v8a.apk"
          ls -l "$OUT"

      - name: Artefact
        uses: actions/upload-artifact@v4
        with:
          name: obtainx-thor-${{ steps.version.outputs.name }}
          path: build/app/outputs/flutter-apk/ObtainX-Thor-*.apk

      - name: Release
        if: steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.name }}" \
            build/app/outputs/flutter-apk/ObtainX-Thor-*.apk \
            --title "ObtainX Thor ${{ steps.version.outputs.name }}" \
            --notes "Fork d'ObtainX avec abonnement aux packs Obtainium (Recomp, RJNY, Joey's). Basé sur ObtainX $(grep -oP '^version: \K[^+]+' pubspec.yaml)." \
            --latest
